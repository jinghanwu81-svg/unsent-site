<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unsent Chat</title>
</head>
<body style="margin:0;background:linear-gradient(to bottom,#0b1020,#111827);color:white;font-family:Arial,Helvetica,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;">
  <div style="width:100%;max-width:900px;height:90vh;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:24px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,0.3);">
    
    <div style="padding:20px 24px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;justify-content:space-between;align-items:center;">
      <div>
        <h1 style="margin:0;font-size:24px;">Unsent</h1>
        <p style="margin:6px 0 0;color:#94a3b8;font-size:14px;">Before you text him, text here.</p>
      </div>
      <div style="display:flex;gap:10px;">
        <button style="padding:10px 14px;border:none;border-radius:999px;background:#1e293b;color:white;cursor:pointer;">Ex</button>
        <button style="padding:10px 14px;border:none;border-radius:999px;background:#1e293b;color:white;cursor:pointer;">Ideal Boyfriend</button>
        <button style="padding:10px 14px;border:none;border-radius:999px;background:#1e293b;color:white;cursor:pointer;">Clear-minded Friend</button>
      </div>
    </div>

    <div style="flex:1;padding:24px;overflow:auto;display:flex;flex-direction:column;gap:16px;">
      <div style="align-self:flex-start;max-width:70%;padding:14px 18px;border-radius:18px 18px 18px 6px;background:rgba(255,255,255,0.08);color:#e5e7eb;line-height:1.6;">
        Hey. You can say it here first.
      </div>

      <div style="align-self:flex-end;max-width:70%;padding:14px 18px;border-radius:18px 18px 6px 18px;background:#ffffff;color:#111827;line-height:1.6;">
        I miss him again.
      </div>

      <div style="align-self:flex-start;max-width:70%;padding:14px 18px;border-radius:18px 18px 18px 6px;background:rgba(255,255,255,0.08);color:#e5e7eb;line-height:1.6;">
        I know. You don’t have to make it smaller here.
      </div>
    </div>

    <div style="padding:18px 20px;border-top:1px solid rgba(255,255,255,0.08);display:flex;gap:12px;align-items:center;">
      <input 
        type="text" 
        placeholder="Write what you wanted to send him..." 
        style="flex:1;padding:16px 18px;border:none;border-radius:999px;background:rgba(255,255,255,0.08);color:white;outline:none;font-size:15px;"
      />
      <button style="padding:14px 22px;border:none;border-radius:999px;background:white;color:#111827;font-size:15px;cursor:pointer;">
        Send
      </button>
    </div>
  </div>
</body>
</html>
