<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unsent Chat</title>
</head>
<body style="margin:0;background:linear-gradient(to bottom,#0b1020,#111827);color:white;font-family:Arial,Helvetica,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;">
  <div style="width:100%;max-width:900px;height:90vh;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:24px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,0.3);">
    
    <div style="padding:20px 24px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
      <div>
        <h1 style="margin:0;font-size:24px;">Unsent</h1>
        <p style="margin:6px 0 0;color:#94a3b8;font-size:14px;">Before you text him, text here.</p>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:10px;">
  <div id="modeLabel" style="font-size:14px;color:#94a3b8;">Current mode: Ex</div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;">
    <button id="btnEx" onclick="setMode('ex')" style="padding:10px 14px;border:none;border-radius:999px;background:white;color:#111827;cursor:pointer;">Ex</button>
    <button id="btnIdeal" onclick="setMode('ideal')" style="padding:10px 14px;border:none;border-radius:999px;background:#1e293b;color:white;cursor:pointer;">Ideal Boyfriend</button>
    <button id="btnFriend" onclick="setMode('friend')" style="padding:10px 14px;border:none;border-radius:999px;background:#1e293b;color:white;cursor:pointer;">Clear-minded Friend</button>
  </div>
</div>
    </div>

    <div style="padding:14px 20px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;gap:10px;flex-wrap:wrap;">
      <button onclick="setQuickText('I miss him so much right now.')" style="padding:10px 14px;border:none;border-radius:999px;background:rgba(255,255,255,0.08);color:white;cursor:pointer;">I miss him</button>
      <button onclick="setQuickText('I want to text him right now.')" style="padding:10px 14px;border:none;border-radius:999px;background:rgba(255,255,255,0.08);color:white;cursor:pointer;">I want to text him</button>
      <button onclick="setQuickText('I checked his profile again.')" style="padding:10px 14px;border:none;border-radius:999px;background:rgba(255,255,255,0.08);color:white;cursor:pointer;">I checked his profile again</button>
      <button onclick="setQuickText('I can’t sleep tonight.')" style="padding:10px 14px;border:none;border-radius:999px;background:rgba(255,255,255,0.08);color:white;cursor:pointer;">I can’t sleep</button>
    </div>

    <div id="chatBox" style="flex:1;padding:24px;overflow:auto;display:flex;flex-direction:column;gap:16px;">
      <div style="align-self:flex-start;max-width:70%;padding:14px 18px;border-radius:18px 18px 18px 6px;background:rgba(255,255,255,0.08);color:#e5e7eb;line-height:1.6;">
        Hey. You can say it here first.
      </div>

      <div style="align-self:flex-end;max-width:70%;padding:14px 18px;border-radius:18px 18px 6px 18px;background:#ffffff;color:#111827;line-height:1.6;">
        I miss him again.
      </div>

      <div style="align-self:flex-start;max-width:70%;padding:14px 18px;border-radius:18px 18px 18px 6px;background:rgba(255,255,255,0.08);color:#e5e7eb;line-height:1.6;">
        I know. You don’t have to make it smaller here.
      </div>
    </div>

    <div style="padding:18px 20px;border-top:1px solid rgba(255,255,255,0.08);display:flex;gap:12px;align-items:center;">
      <input 
        id="messageInput"
        type="text" 
        placeholder="Write what you wanted to send him..." 
        style="flex:1;padding:16px 18px;border:none;border-radius:999px;background:rgba(255,255,255,0.08);color:white;outline:none;font-size:15px;"
      />
      <button onclick="sendMessage()" style="padding:14px 22px;border:none;border-radius:999px;background:white;color:#111827;font-size:15px;cursor:pointer;">
        Send
      </button>
    </div>
  </div>

 <script>
  let currentMode = "ex";

  function setMode(mode) {
  currentMode = mode;

  const modeLabel = document.getElementById("modeLabel");
  const btnEx = document.getElementById("btnEx");
  const btnIdeal = document.getElementById("btnIdeal");
  const btnFriend = document.getElementById("btnFriend");

  btnEx.style.background = "#1e293b";
  btnEx.style.color = "white";
  btnIdeal.style.background = "#1e293b";
  btnIdeal.style.color = "white";
  btnFriend.style.background = "#1e293b";
  btnFriend.style.color = "white";

  if (mode === "ex") {
    modeLabel.textContent = "Current mode: Ex";
    btnEx.style.background = "white";
    btnEx.style.color = "#111827";
  }

  if (mode === "ideal") {
    modeLabel.textContent = "Current mode: Ideal Boyfriend";
    btnIdeal.style.background = "white";
    btnIdeal.style.color = "#111827";
  }

  if (mode === "friend") {
    modeLabel.textContent = "Current mode: Clear-minded Friend";
    btnFriend.style.background = "white";
    btnFriend.style.color = "#111827";
  }
}

  function setQuickText(text) {
    document.getElementById("messageInput").value = text;
  }

  function getReply(message) {
    const lower = message.toLowerCase();

    if (currentMode === "ex") {
      if (lower.includes("miss") || message.includes("想你")) {
        return "I know. I’m still here in the way you remember me.";
      }
      if (lower.includes("text") || message.includes("联系")) {
        return "You can say it here first. You don’t have to send it yet.";
      }
      return "I know this still hurts, don’t rush yourself.";
    }

    if (currentMode === "ideal") {
      if (lower.includes("miss") || message.includes("想你")) {
        return "Come here. You don’t need to hold this alone.";
      }
      if (lower.includes("sleep") || message.includes("睡")) {
        return "It’s okay. Stay here a little longer, and breathe slowly.";
      }
      return "I’m here with you. Say it slowly.";
    }

    if (currentMode === "friend") {
      if (lower.includes("text") || message.includes("联系")) {
        return "You probably want relief, not really him. Don’t send it yet.";
      }
      if (lower.includes("profile") || message.includes("主页")) {
        return "Checking again will only reopen it. Close it for tonight.";
      }
      return "I know it’s hard, but this feeling will pass.";
    }

    return "I’m here. You can keep talking.";
  }

  function sendMessage() {
    const input = document.getElementById("messageInput");
    const chatBox = document.getElementById("chatBox");
    const message = input.value.trim();

    if (message === "") return;

    const userMessage = document.createElement("div");
    userMessage.style.alignSelf = "flex-end";
    userMessage.style.maxWidth = "70%";
    userMessage.style.padding = "14px 18px";
    userMessage.style.borderRadius = "18px 18px 6px 18px";
    userMessage.style.background = "#ffffff";
    userMessage.style.color = "#111827";
    userMessage.style.lineHeight = "1.6";
    userMessage.textContent = message;
    chatBox.appendChild(userMessage);

    const reply = document.createElement("div");
    reply.style.alignSelf = "flex-start";
    reply.style.maxWidth = "70%";
    reply.style.padding = "14px 18px";
    reply.style.borderRadius = "18px 18px 18px 6px";
    reply.style.background = "rgba(255,255,255,0.08)";
    reply.style.color = "#e5e7eb";
    reply.style.lineHeight = "1.6";
    reply.textContent = getReply(message);

    setTimeout(() => {
      chatBox.appendChild(reply);
      chatBox.scrollTop = chatBox.scrollHeight;
    }, 400);

    input.value = "";
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  document.getElementById("messageInput").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      sendMessage();
    }
  });
</script>
